<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProTask - Task Management Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar / Brand -->
    <aside class="sidebar">
      <h2>ProTask</h2>
      <p class="subtitle">Task Management System</p>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Dashboard Analytics Cards -->
      <section class="analytics-grid">
        <div class="stat-card">
          <h3>Total</h3>
          <p id="statTotal">0</p>
        </div>
        <div class="stat-card">
          <h3>Completed</h3>
          <p id="statCompleted">0</p>
        </div>
        <div class="stat-card">
          <h3>Pending</h3>
          <p id="statPending">0</p>
        </div>
        <div class="stat-card">
          <h3>In Progress</h3>
          <p id="statInProgress">0</p>
        </div>
        <div class="stat-card">
          <h3>Overdue</h3>
          <p id="statOverdue">0</p>
        </div>
        <div class="stat-card highlight">
          <h3>Completion Rate</h3>
          <p id="statRate">0%</p>
        </div>
      </section>

      <div class="dashboard-body">
        <!-- Form Panel -->
        <section class="card form-panel">
          <h2 id="formTitle">Create New Task</h2>
          <form id="taskForm" novalidate>
            <input type="hidden" id="taskId">
            
            <div class="form-group">
              <label for="taskTitle">Task Title *</label>
              <input type="text" id="taskTitle" placeholder="e.g., Build Portfolio">
            </div>

            <div class="form-group">
              <label for="taskDesc">Description *</label>
              <textarea id="taskDesc" rows="3" placeholder="Enter task details"></textarea>
            </div>

            <div class="form-group">
              <label for="taskPriority">Priority</label>
              <select id="taskPriority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskStatus">Status</label>
              <select id="taskStatus">
                <option value="To Do" selected>To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskDueDate">Due Date *</label>
              <input type="date" id="taskDueDate">
            </div>

            <div id="formMsg" class="form-msg"></div>

            <div class="btn-row">
              <button type="submit" id="btnSubmit" class="btn btn-primary">Add Task</button>
              <button type="button" id="btnCancelEdit" class="btn btn-secondary" style="display:none;">Cancel</button>
            </div>
          </form>
        </section>

        <!-- Tasks Display Panel -->
        <section class="card display-panel">
          <!-- Controls bar -->
          <div class="controls-bar">
            <input type="text" id="searchInput" placeholder="Search tasks by title...">
            <select id="filterStatus">
              <option value="ALL">All Statuses</option>
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
            <select id="filterPriority">
              <option value="ALL">All Priorities</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
            <select id="sortControl">
              <option value="dueDate">Sort by Due Date</option>
              <option value="priority">Sort by Priority</option>
              <option value="createdAt">Sort by Creation Date</option>
            </select>
          </div>

          <!-- Tasks List Container -->
          <div id="taskList" class="task-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/taskService.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
